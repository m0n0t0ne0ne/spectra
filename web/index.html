<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spectra">
<meta name="description" content="Spectra: a food diary that tracks every nutrient, label first.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://world.openfoodfacts.org https://api.nal.usda.gov https://api.upcitemdb.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Spectra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:Manrope;font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  color-scheme:dark;
  --bg:#121513; --card:#1A1F1C; --card-solid:#1A1F1C; --edge:transparent;
  --fill:#222824; --fill-2:#2C332F; --line:#2A302C;
  --text:#E8ECE9; --text-2:#A3ABA6; --text-3:#8A938D; --text-4:#5C6660;
  --lilac:#8FD3B6; --sky:#9DB4F2; --wheat:#F2C28F; --sage:#8FD3B6; --rose:#F29B8F; --on-accent:#12201A;
  --lilac-t:rgba(143,211,182,.14); --sage-t:rgba(143,211,182,.14); --rose-t:rgba(242,155,143,.16); --wheat-t:rgba(242,194,143,.16); --sky-t:rgba(157,180,242,.16);
  --radius:24px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.sum-tabs{position:relative;display:flex;justify-content:space-between;margin:14px 14px 0;padding:4px;background:var(--fill);border-radius:22px}
.sum-pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:18px;background:var(--fill-2);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .34s cubic-bezier(.2,.8,.2,1),width .34s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sum-tab{position:relative;flex:none;padding:0 14px;height:32px;border:none;background:none;border-radius:18px;font:inherit;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;transition:color .25s}
.sum-tab[aria-selected="true"]{color:var(--text)}
.seg-sm{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:16px}
.seg-sm .chip{height:28px;padding:0 12px;font-size:12.5px;background:transparent;color:var(--text-2)}
.seg-sm .chip[aria-pressed="true"]{background:var(--fill-2);color:var(--text)}
.trend-chart{display:block;overflow:visible}
.trend-chart [data-trend-day]{cursor:pointer}
.sv-fields .chip:not([aria-pressed="true"]){background:var(--fill-2)}
.sv-fields .chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.add-search{position:relative;display:flex;align-items:center;height:52px;border-radius:26px;background:var(--fill);border:1px solid transparent;transition:border-color .2s}
.add-search:focus-within{border-color:var(--lilac)}
.add-search input{flex:1;min-width:0;height:100%;border:none;background:transparent;color:var(--text);font:inherit;font-size:16px;outline:none;padding:0 16px 0 46px}
.add-search input::-webkit-search-cancel-button{filter:invert(.7)}
.add-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-3);display:flex}
.add-scan-btn{flex:none;width:52px;height:52px;border:none;border-radius:26px;background:var(--lilac);color:var(--on-accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.add-link{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--lilac);font:inherit;font-size:14px;font-weight:600;padding:10px 8px;cursor:pointer}
.food-tile{flex:none;display:flex;align-items:center;justify-content:center;background:var(--fill-2);color:var(--lilac)}
.tile-btn{padding:0;border:none;background:none;border-radius:20px;flex:none;cursor:pointer}
.kind-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;max-height:52vh;overflow-y:auto;padding:2px}
.kind-opt{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;color:var(--text-2);font:inherit;font-size:11.5px;line-height:1.25;text-align:center;padding:4px 2px;border-radius:16px;cursor:pointer}
.kind-opt[aria-pressed="true"]{color:var(--text)}
.kind-opt[aria-pressed="true"] .food-tile{background:var(--lilac);color:var(--on-accent)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
textarea.input{color:var(--text);caret-color:var(--lilac)}
.input::placeholder{color:var(--text-3);opacity:1}
select.input option{background:var(--card);color:var(--text)}
a{color:inherit;text-decoration:none}
#app{max-width:480px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 0 calc(110px + var(--safe-b));min-height:100dvh;position:relative}
.screen{padding:0 16px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:12px} .s13{font-size:13px} .s14{font-size:14px} .s15{font-size:15px}
.b6{font-weight:600} .b7{font-weight:700}
.big{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1}
.h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
.h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius)}
.pad{padding:18px 20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:none;background:var(--fill);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.icon-btn.ghost{background:transparent;color:var(--text-2)}
.btn{height:52px;border-radius:26px;border:none;padding:0 22px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--lilac);color:var(--on-accent)}
.btn.tint{background:var(--lilac-t);color:var(--lilac)}
.btn.quiet{background:var(--fill);color:var(--text)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{height:38px;padding:0 14px;border-radius:19px;border:none;background:var(--fill);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--card);border:1px solid var(--edge);border-radius:22px}
.seg .chip{background:transparent;color:var(--text-2);justify-content:center}
.seg .chip[aria-pressed="true"]{background:var(--fill-2);color:var(--text)}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;flex:none}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:.02em;white-space:nowrap}
.tag.label{background:var(--fill-2);color:var(--text-2)}
.tag.spec{background:var(--lilac-t);color:var(--lilac)}
.tag.lab{background:var(--sky-t);color:var(--sky)}
.tag.est{background:var(--wheat-t);color:var(--wheat)}
.bar{height:5px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px}
.stack{display:flex;gap:2px;border-radius:4px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.input{height:48px;border-radius:14px;border:1px solid var(--edge);background:var(--fill);padding:0 14px;width:100%;outline:none}
.input:focus{border-color:var(--lilac)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
.empty{padding:22px;text-align:center;color:var(--text-2);font-size:14px}
.err{background:var(--rose-t);color:var(--rose);border-radius:14px;padding:12px 14px;font-size:13px}
.note{background:var(--fill);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;color:#CFCFD6}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.top .title{display:flex;flex-direction:column;align-items:center}

/* Timeline */
.meal{overflow:hidden}
@property --p{syntax:'<number>';inherits:true;initial-value:0}
@keyframes peek{0%,100%{--p:0}40%,55%{--p:.42}}
.meal-head.peek:not(.open):not(.dragging){animation:peek 1.1s cubic-bezier(.22,1,.36,1)}
.meal-head{position:relative;--p:0;--ease:cubic-bezier(.22,1,.36,1)}
.meal-head.open{--p:1}
.meal-reveal{position:absolute;inset:0 auto 0 0;width:76px;display:flex;align-items:center;justify-content:center}
.meal-reveal .icon-btn{opacity:var(--p);transform:scale(calc(.55 + .45 * var(--p)));transition:opacity .3s var(--ease),transform .3s var(--ease)}
.meal-front{position:relative;width:100%;background:var(--card-solid);display:flex;align-items:center;gap:10px;padding:16px 8px 16px 18px;border-radius:0 0 0 0;transform:translateX(calc(76px * var(--p)));width:calc(100% - 76px * var(--p));transition:transform .34s var(--ease),width .34s var(--ease);touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.meal-head.open .meal-front{border-radius:18px 0 0 18px}
.meal-front .add-btn{flex:none;overflow:hidden;opacity:calc(1 - var(--p));width:calc(44px * (1 - var(--p)));margin-left:calc(-10px * var(--p));transition:opacity .2s var(--ease),width .34s var(--ease),margin .34s var(--ease)}
.meal-head.open .meal-front .add-btn{pointer-events:none}
.meal-head.dragging .meal-front,.meal-head.dragging .add-btn,.meal-head.dragging .meal-reveal .icon-btn{transition:none}
.meal-head:has(:focus-visible):not(.dragging){--p:1}
.nut-head .meal-front{padding:0;gap:0;background:var(--card)}
.entry-head .meal-front{padding:0;gap:0;background:var(--card)}
.entry-head .meal-front>.entry-row{flex:1;min-width:0}
.entry-head.open .meal-front{border-radius:0}
.entry-menu{margin:2px 0 8px}
.nut-head .meal-front>*{flex:1;min-width:0}
.nut-head .meal-reveal{width:76px}
.nut-head.open .meal-front{border-radius:0}
.switch{position:relative;flex:none;width:52px;height:32px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--fill-2);transition:background .2s}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:var(--text-2);transition:transform .22s cubic-bezier(.22,1,.36,1),background .2s}
.switch input:checked+span{background:var(--lilac)}
.switch input:checked+span::after{transform:translateX(20px);background:var(--on-accent)}
.switch input:focus-visible+span{outline:2px solid var(--lilac);outline-offset:2px}
.meal-head.open .meal-reveal{cursor:pointer}
@media (prefers-reduced-motion:reduce){.meal-front,.meal-front .add-btn,.meal-reveal .icon-btn{transition:none}.meal-head.peek{animation:none}}
.menu{margin:0 8px 8px;padding:4px;background:var(--fill-2);border-radius:16px;display:flex;flex-direction:column}
.menu>*{min-height:46px;padding:0 12px;border:none;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;font-size:14px;cursor:pointer;border-radius:12px}
.menu>.danger{color:var(--rose)}
.menu>[disabled]{opacity:.4;cursor:default}
.ins-range{display:flex;gap:2px;padding:4px;background:var(--fill);border-radius:22px}
.ins-range .chip{flex:1;height:34px;justify-content:center;background:transparent;color:var(--text-2);font-size:13.5px}
.ins-range .chip[aria-pressed="true"]{background:var(--fill-2);color:var(--text)}
.ins-card{padding:20px 20px 22px}
.ins-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.ins-h .h2{margin:0;font-size:18px}
.ins-num{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ins-badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px 0 7px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.ins-checks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ins-check{display:grid;grid-template-columns:1fr auto 10px;grid-template-rows:auto auto;column-gap:10px;padding:11px 0;border:none;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer}
.ins-check:active{opacity:.7}
.ins-chev{grid-column:3;grid-row:1/3;align-self:center;color:var(--text-3);font-size:20px;line-height:1}
.ins-card,.ins-nrow,.ins-tipcard{scroll-margin-top:16px}
.ins-flash{animation:insflash 1.4s ease-out}
@keyframes insflash{0%,30%{box-shadow:inset 0 0 0 2px var(--lilac)}100%{box-shadow:inset 0 0 0 2px transparent}}
.ins-ratio{position:relative;height:10px;border-radius:5px;background:var(--fill-2)}
.ins-ratio-zone{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:var(--lilac-t);border-right:2px dashed var(--text-2)}
.ins-check:last-child{border-bottom:none;padding-bottom:0}
.ins-check .ins-badge{grid-column:2;grid-row:1/3;align-self:center}
.ins-check>.s14,.ins-check>.small{grid-column:1}
.ins-svg{display:block;overflow:visible;margin-top:6px}
.ins-svg .sel{opacity:1;filter:brightness(1.15);stroke:var(--text);stroke-width:1.2}
.ins-tip{min-height:20px;margin-top:6px;line-height:1.4}
.ins-tip.on{color:var(--text)}
.ins-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--text-2)}
.ins-legend span{display:inline-flex;align-items:center;gap:6px}
.ins-legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.ins-legend i.dash{width:16px;height:0;border-top:2px dashed var(--text);border-radius:0}
.ins-legend i.tick{width:2px;height:12px;border-radius:1px;background:var(--text-2)}
.ins-li{min-height:44px;border-top:1px solid var(--line);gap:10px}
.ins-gauge{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--sky-t),var(--fill-2) 50%,var(--wheat-t))}
.ins-gauge-zero{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--text-4);border-radius:1px}
.ins-gauge-goal{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--text)}
.ins-gauge-goal em{position:absolute;bottom:calc(100% + 3px);left:0;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;white-space:nowrap;color:var(--text)}
.ins-gauge-dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--card)}
.ins-gauge{margin-top:28px}
.ins-stack{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.ins-nlist{display:flex;flex-direction:column}
.ins-nrow,.ins-mrow{display:grid;grid-template-columns:minmax(0,118px) 1fr 42px;align-items:center;gap:12px;min-height:34px}
.ins-mrow{grid-template-columns:minmax(0,96px) 1fr 76px;min-height:22px}
.ins-nbar{position:relative;height:8px;border-radius:4px;background:var(--fill-2)}
.ins-nbar>span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.ins-nbar>i{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text-2)}
.ins-tipcard{padding:14px;border-radius:18px;background:var(--fill)}
.ins-lrow{border:none;background:none;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%;align-items:stretch}
.ins-tipcard.ins-lrow{padding:14px;background:var(--fill)}
.ins-lrow:active{opacity:.7}
.ins-day>summary,#lim-scrim details>summary{list-style:none;cursor:pointer}
.ins-day>summary::-webkit-details-marker,#lim-scrim details>summary::-webkit-details-marker{display:none}
.ins-day[open]>summary b{text-decoration:none}
.ins-sign{flex:none;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.ins-sign.add{background:var(--lilac-t);color:var(--lilac)}
.ins-sign.cut{background:var(--rose-t);color:var(--rose)}
.ins-cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:4px}
.ins-cal .ins-cell{aspect-ratio:1;border-radius:4px;background:var(--fill-2)}
.ins-cal .ins-cell.full{background:var(--lilac)}
.ins-cal .ins-cell.part{background:var(--wheat)}
.dm-cat{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.dm-cat:active{opacity:.7}
.dm-chev{display:flex;color:var(--text-3)}
.dm-row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:none;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;padding:0;cursor:pointer}
.dm-row:first-child{border-top:none}
.dm-row[disabled]{cursor:default}
.dm-row[disabled] .s14{color:var(--text-2)}
.dm-hit{display:flex;align-items:center;gap:12px;border:none;background:none;color:inherit;font:inherit;padding:0;min-height:58px;cursor:pointer}
.dm-check{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--text-4);display:flex;align-items:center;justify-content:center;color:var(--on-accent);transition:background .15s,border-color .15s}
.dm-check[data-state="on"]{background:var(--lilac);border-color:var(--lilac)}
.dm-check[data-state="on"] svg{width:13px;height:13px}
.dm-check[data-state="some"]{border-color:var(--lilac)}
.dm-check[data-state="some"] i{width:10px;height:2.5px;border-radius:2px;background:var(--lilac)}
.dm-check[data-state="locked"]{border-style:dashed;border-color:var(--fill-2)}
.dm-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(14px + var(--safe-b));background:var(--card);border-top:1px solid var(--line)}
.dm-bar-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dm-bar .btn{height:44px;padding:0 18px}
.save-pill{height:36px;padding:0 16px;font-size:14px;border-radius:18px;flex:none}
.was-btn{border:none;background:none;padding:2px 0 0;color:var(--lilac);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--lilac-t);text-underline-offset:3px}
.menu-sep{min-height:0!important;height:1px;padding:0!important;margin:4px 12px;background:var(--line)}
.link-btn{border:none;background:transparent;padding:6px 4px;cursor:pointer;font-family:inherit}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;width:100%;border:none;background:transparent;text-align:left;cursor:pointer}
.entry-row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative}
.entry-list.reordering>.entry-head{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.entry-list.reordering>.entry-head.lifted{transition:none;z-index:5}
.entry-list.reordering>.entry-head.lifted.settling{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.entry-list.reordering>.entry-head.lifted .meal-front{background:var(--fill-2);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);margin:0 -8px;padding:0 8px;width:calc(100% + 16px)}
.entry-list.reordering>.entry-head.lifted .entry-row{border-top-color:transparent}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(14px + var(--safe-b));background:var(--card);border-top:1px solid var(--line)}
nav.tabs .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;font-size:11px;color:var(--text-2)}
nav.tabs a[aria-current="page"]{color:var(--lilac);font-weight:600}
nav.tabs a.scan{width:54px;height:54px;border-radius:20px;background:var(--lilac);color:var(--on-accent);justify-content:center}

/* Scanner */
.viewfinder{position:relative;margin:16px 16px 0;height:300px;border-radius:26px;overflow:hidden;background:#000;border:1px solid var(--edge)}
.viewfinder video{width:100%;height:100%;object-fit:cover}
.viewfinder .frame{position:absolute;left:50%;top:50%;width:260px;height:150px;transform:translate(-50%,-50%)}
.viewfinder .c{position:absolute;width:34px;height:34px;border-color:var(--lilac);border-style:solid;border-width:0}
.viewfinder .c.tl{left:0;top:0;border-left-width:3px;border-top-width:3px;border-top-left-radius:18px}
.viewfinder .c.tr{right:0;top:0;border-right-width:3px;border-top-width:3px;border-top-right-radius:18px}
.viewfinder .c.bl{left:0;bottom:0;border-left-width:3px;border-bottom-width:3px;border-bottom-left-radius:18px}
.viewfinder .c.br{right:0;bottom:0;border-right-width:3px;border-bottom-width:3px;border-bottom-right-radius:18px}
.viewfinder .line{position:absolute;left:14px;right:14px;top:50%;height:2px;background:var(--lilac);box-shadow:0 0 12px var(--lilac);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-55px)}50%{transform:translateY(55px)}}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:14px}
.step .mark{width:24px;flex:none;display:flex;flex-direction:column;align-items:center}
.step .mark .o{width:24px;height:24px;border-radius:12px;border:2px solid var(--text-4);display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.step .mark .ln{width:2px;flex:1;min-height:16px;background:var(--line)}
.step.found .o,.step.cached .o{background:var(--lilac);border-color:var(--lilac)}
.step.running .o{border-color:var(--lilac);border-top-color:transparent;animation:spin .9s linear infinite}
.step.skipped .o,.step.none .o{border-style:dashed}
.step.error .o{border-color:var(--rose)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.viewfinder .line,.step.running .o{animation:none}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--edge);border-bottom:none;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--safe-b));max-height:88dvh;overflow:auto}
.handle{width:36px;height:4px;border-radius:2px;background:var(--text-4);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:18px;font-size:14px;font-weight:600;z-index:40;max-width:90vw}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:50;background:#fff;color:#000;padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="app" tabindex="-1"><div id="main"></div></main>
<nav class="tabs" aria-label="Main"><div class="in" id="tabs"></div></nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
