name: Release

# Push a tag like v1.0.1 to build, sign and publish a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.1
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check signing secrets
        id: secrets
        env:
          KS: ${{ secrets.SPECTRA_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SPECTRA_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A release published by hand (like v1.0.0) is fine; anything else needs the key.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published. Add SPECTRA_KEYSTORE_BASE64 and SPECTRA_KEYSTORE_PASSWORD to the 'release' environment so future tags build automatically (see RELEASING.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::Add SPECTRA_KEYSTORE_BASE64 and SPECTRA_KEYSTORE_PASSWORD to the 'release' environment secrets. See RELEASING.md."
          exit 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.secrets.outputs.ready == 'true'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Build and sign
        if: steps.secrets.outputs.ready == 'true'
        working-directory: android
        env:
          SPECTRA_KEYSTORE_BASE64: ${{ secrets.SPECTRA_KEYSTORE_BASE64 }}
          SPECTRA_KEYSTORE_PASSWORD: ${{ secrets.SPECTRA_KEYSTORE_PASSWORD }}
          SPECTRA_KEY_PASSWORD: ${{ secrets.SPECTRA_KEYSTORE_PASSWORD }}
          SPECTRA_KEY_ALIAS: spectra
        run: |
          export SPECTRA_KEYSTORE_FILE="$RUNNER_TEMP/spectra-release.jks"
          echo "$SPECTRA_KEYSTORE_BASE64" | base64 -d > "$SPECTRA_KEYSTORE_FILE"
          export VERSION_NAME="${TAG#v}"
          ./gradlew assembleRelease --no-daemon
          rm -f "$SPECTRA_KEYSTORE_FILE"

      - name: Verify signature and prepare files
        if: steps.secrets.outputs.ready == 'true'
        run: |
          VERSION="${TAG#v}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Spectra-$VERSION.apk"
          cp "dist/Spectra-$VERSION.apk" dist/Spectra.apk
          "$APKSIGNER" verify --print-certs "dist/Spectra.apk" | tee dist/signing-certificate.txt
          grep -q "D3:83:DB:A8:E0:45:83:83:64:D0:5A:D6:3C:88:00:B5:78:89:F3:67:3F:9F:F7:8B:C9:F4:B4:69:6E:4F:6E:E6" <(sed 's/^.*SHA-256 digest: //' dist/signing-certificate.txt | tr a-f A-F | sed 's/../&:/g;s/:$//') \
            || { echo "::error::APK is not signed with the Spectra release key"; exit 1; }
          (cd dist && sha256sum Spectra-*.apk Spectra.apk > SHA256SUMS.txt)

      - name: Publish the release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Spectra ${TAG#v}" --generate-notes
          fi
