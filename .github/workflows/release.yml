name: Release

# Fully automatic: when a push to main changes the number in VERSION to one that hasn't been released yet,
# this builds the APK, signs it with the release key, verifies the signature, creates the vX.Y.Z tag and
# publishes the GitHub release. Nobody needs to create tags or releases by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild an existing release, e.g. v1.0.1 (leave empty to release the current VERSION)
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VERSION=$(tr -d ' \n\r' < VERSION)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION must look like 1.2.3, got '$VERSION'"; exit 1; }
          grep -q "APP_VERSION = '$VERSION'" web/js/app.js || { echo "::error::APP_VERSION in web/js/app.js doesn't match VERSION ($VERSION)"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.ref }}

      - name: Check signing secrets
        env:
          KS: ${{ secrets.SPECTRA_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SPECTRA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add SPECTRA_KEYSTORE_BASE64 and SPECTRA_KEYSTORE_PASSWORD to the 'release' environment secrets. See RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The runner image ships the Android SDK (ANDROID_HOME).
      - name: Build and sign
        working-directory: android
        env:
          SPECTRA_KEYSTORE_BASE64: ${{ secrets.SPECTRA_KEYSTORE_BASE64 }}
          SPECTRA_KEYSTORE_PASSWORD: ${{ secrets.SPECTRA_KEYSTORE_PASSWORD }}
          SPECTRA_KEY_PASSWORD: ${{ secrets.SPECTRA_KEYSTORE_PASSWORD }}
          SPECTRA_KEY_ALIAS: spectra
        run: |
          export SPECTRA_KEYSTORE_FILE="$RUNNER_TEMP/spectra-release.jks"
          echo "$SPECTRA_KEYSTORE_BASE64" | base64 -d > "$SPECTRA_KEYSTORE_FILE"
          export VERSION_NAME="${TAG#v}"
          ./gradlew assembleRelease --no-daemon
          rm -f "$SPECTRA_KEYSTORE_FILE"

      - name: Verify signature and prepare files
        run: |
          VERSION="${TAG#v}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Spectra-$VERSION.apk"
          cp "dist/Spectra-$VERSION.apk" dist/Spectra.apk
          "$APKSIGNER" verify --print-certs "dist/Spectra.apk" | tee dist/signing-certificate.txt
          grep -q "D3:83:DB:A8:E0:45:83:83:64:D0:5A:D6:3C:88:00:B5:78:89:F3:67:3F:9F:F7:8B:C9:F4:B4:69:6E:4F:6E:E6" <(sed 's/^.*SHA-256 digest: //' dist/signing-certificate.txt | tr a-f A-F | sed 's/../&:/g;s/:$//') \
            || { echo "::error::APK is not signed with the Spectra release key"; exit 1; }
          (cd dist && sha256sum Spectra-*.apk Spectra.apk > SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            NOTES=".github/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" dist/* --target "$REF" --title "Spectra ${TAG#v}" --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" dist/* --target "$REF" --title "Spectra ${TAG#v}" --generate-notes --latest
            fi
          fi
