name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the web app's JavaScript
        run: for f in web/js/*.js web/sw.js; do node --check "$f"; done

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The runner image ships the Android SDK (ANDROID_HOME). No signing secrets here: pull requests from forks never see them. The APK is built unsigned.
      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
