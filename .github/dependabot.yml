version: 2
# One grouped pull request a month per area, minor and patch updates only.
# Major versions (new Gradle, Android Gradle Plugin, Kotlin, Actions) need testing, so they're updated by hand.
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      android:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
